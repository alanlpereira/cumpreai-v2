<div class="app-screen active" id="screen-login">
  <div class="login-header">
    <h2>Acesse sua Conta</h2>
    <p>Entre com seus dados para acessar seus painéis</p>
  </div>

  <form id="login-form" action="javascript:void(0);" onsubmit="handleLogin(); return false;">
    <div class="form-group">
      <label for="login-email" style="font-weight:600; color:#d1d5db; font-size:0.78rem;">Endereço de E-mail</label>
      <input type="email" id="login-email" name="username" autocomplete="off" placeholder="alan.pereira@lp-nexus.com" required style="width:100%; padding:0.5rem; background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(255,255,255,0.25); border-radius:8px; font-size:0.82rem;">
    </div>

    <div class="form-group">
      <label for="login-pass" style="font-weight:600; color:#d1d5db; font-size:0.78rem;">Senha de Acesso</label>
      <div style="position:relative; display:flex; align-items:center;">
        <input type="password" id="login-pass" name="password" autocomplete="new-password" placeholder="Digite sua senha de acesso" required style="width:100%; padding:0.5rem; padding-right:2.5rem; background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(255,255,255,0.25); border-radius:8px; font-size:0.82rem;">
        <button type="button" id="toggle-login-pass-btn" onclick="togglePasswordVisibility('login-pass', 'toggle-login-pass-btn')" style="position:absolute; right:0.5rem; background:none; border:none; color:#a78bfa; cursor:pointer; font-size:1.1rem; padding:2px;" title="Mostrar/Ocultar Senha">👁️</button>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
      <label style="font-size:0.72rem; color:var(--text-secondary); display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
        <input type="checkbox" id="remember-credentials"> 🔒 Salvar credenciais no cofre
      </label>
      <button type="button" style="background:none; border:none; color:#a78bfa; font-size:0.72rem; cursor:pointer;" onclick="openForgotPasswordModal()">Esqueci minha senha</button>
    </div>

    <div id="login-notice" style="font-size:0.72rem; color:#10b981; margin-bottom:0.6rem; display:none; text-align:center; background:rgba(16, 185, 129, 0.1); padding:0.5rem; border-radius:8px; border:1px solid rgba(16, 185, 129, 0.3);"></div>

    <div style="display:flex; flex-direction:column; gap:0.45rem;">
      <button type="submit" class="btn-primary" style="font-weight:700; padding:0.6rem;">🔑 Entrar na Plataforma</button>
      <button type="button" class="btn-secondary" style="border-color:#10b981; color:#10b981; font-size:0.72rem;" onclick="loginAsSuperUser()">👑 Preencher E-mail Master User (alan.pereira@lp-nexus.com)</button>
      <button type="button" class="btn-secondary" style="border-color:#3b82f6; color:#3b82f6; font-size:0.72rem;" onclick="loginAsOrgManager()">🏢 Preencher E-mail Gestor (arthur@camelot.org)</button>
      <button type="button" class="btn-secondary" style="border-color:#ef4444; color:#ef4444; font-size:0.72rem;" onclick="clearVaultCredentials()">🗑️ Limpar Credenciais Salvas do Cofre</button>
      <button type="button" class="btn-secondary" style="border-color:#a78bfa; color:#a78bfa; font-size:0.72rem;" onclick="if(window.router) window.router.navigate('/auth/onboarding'); else showScreen(screenRegisterStep1);">✨ Criar Nova Conta (Auto-Cadastro)</button>
    </div>
  </form>
</div>
